<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ESCORE Control Center</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">E<span>／</span>SCORE.</a><strong>CONTROL CENTER</strong><button id="logout" class="hidden">Sign out</button></header><main><p id="status" role="status"></p><form id="login"><h2>Admin login</h2><label>Email<input type="email" id="email" required></label><label>Password<input type="password" id="password" required></label><button>Sign in</button></form><div id="dashboard" class="hidden"><h2>Editorial desk</h2><a class="btn" href="manager.html">Tournament & data manager ↗</a><p>Only publish verified information. Use the body for score tables, roster details or analysis.</p><form id="editor"><label>Category<select id="type"><option>news</option><option>live</option><option>tournaments</option><option>teams</option><option>mercato</option><option>analysis</option></select></label><label>Region<select id="region"><option>MENA</option><option>Global</option></select></label><label>Event<input id="event" placeholder="FFWS / EWC / MENA"></label><label>Title<input id="title" maxlength="160" required></label><label>Date<input id="date" type="date" required></label><label>Article / details<textarea id="body" maxlength="20000" required></textarea></label><label>Verified source URL<input id="source" type="url" required placeholder="https://..."></label><label>Authorized image URL (optional)<input id="image" type="url"></label><label>Visibility<select id="published"><option value="false">Draft</option><option value="true">Published</option></select></label><div class="actions"><button>Save</button><button type="button" id="reset">New entry</button></div></form><h2>Content library</h2><div id="items" class="cards"></div></div></main><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
